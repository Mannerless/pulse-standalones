<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b18"/><stop offset="0.55" stop-color="#0b2540"/><stop offset="1" stop-color="#0e5a63"/></linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b56cff"/><stop offset="1" stop-color="#19e3ff"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".55"><stop offset="0" stop-color="#19e3ff" stop-opacity=".35"/><stop offset="1" stop-color="#19e3ff" stop-opacity="0"/></radialGradient>
<filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
<clipPath id="card"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
</defs>
<rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
<g clip-path="url(#card)">
  <circle cx="256" cy="256" r="240" fill="url(#glow)"/>
  <rect x="16" y="16" width="480" height="220" fill="url(#shine)"/>
</g>
<rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="4"/>
<!-- vault dial -->
<circle cx="256" cy="256" r="168" fill="none" stroke="url(#ring)" stroke-width="30" filter="url(#blur)" opacity=".85"/>
<circle cx="256" cy="256" r="168" fill="none" stroke="url(#ring)" stroke-width="16"/>
<circle cx="256" cy="256" r="132" fill="#071626" stroke="#19e3ff" stroke-opacity=".35" stroke-width="3"/>
<g stroke="#9fefff" stroke-width="6" stroke-linecap="round" opacity=".8">
  <line x1="256" y1="70" x2="256" y2="92"/><line x1="256" y1="420" x2="256" y2="442"/>
  <line x1="70" y1="256" x2="92" y2="256"/><line x1="420" y1="256" x2="442" y2="256"/>
  <line x1="127" y1="127" x2="142" y2="142"/><line x1="370" y1="370" x2="385" y2="385"/>
  <line x1="385" y1="127" x2="370" y2="142"/><line x1="142" y1="370" x2="127" y2="385"/>
</g>
<!-- padlock -->
<path d="M212 246 V222 a44 44 0 0 1 88 0 V246" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
<rect x="190" y="242" width="132" height="102" rx="22" fill="#fff"/>
<circle cx="256" cy="284" r="14" fill="#0b2540"/>
<rect x="250" y="290" width="12" height="30" rx="6" fill="#0b2540"/>
<!-- pulse line under the lock -->
<polyline points="96,372 176,372 204,338 232,404 262,360 286,372 416,372" fill="none" stroke="#19e3ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#blur)" opacity=".9"/>
<polyline points="96,372 176,372 204,338 232,404 262,360 286,372 416,372" fill="none" stroke="#7df6ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
