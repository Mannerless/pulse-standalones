<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>VaultPulse Admin</title>
<style>
:root{--bg:#0b0c10;--card:#15161e;--hi:#1f202b;--bd:#272938;--tx:#f0f2f5;--mut:#9aa0a6;--blue:#3b82f6;--red:#f43f5e;--green:#10b981;--amber:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--bd)}header h1{font-size:18px;margin:0;flex:1}
main{padding:20px;max-width:1100px;margin:0 auto}nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
button,a.b{background:var(--hi);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;text-decoration:none}
button.on{background:var(--blue);border-color:var(--blue)}button.bad{background:var(--red);border-color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}.card b{font-size:24px;display:block}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;font-size:13px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:top;word-break:break-word}th{color:var(--mut);font-weight:600}
.pill{padding:2px 8px;border-radius:99px;font-size:11px;background:var(--hi)}.ok{color:var(--green)}.no{color:var(--red)}.mut{color:var(--mut)}
#login{max-width:340px;margin:12vh auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px}input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--bd);background:var(--hi);color:#fff;font-size:15px}
select{padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--hi);color:#fff}
</style></head><body>
<header><h1>🛠 VaultPulse Admin</h1><a class="b" href="/">← Vault</a><button id="out" style="display:none">Log out</button></header>
<div id="login"><h2 style="margin-top:0">Admin login</h2><p class="mut" style="font-size:13px">Uses your Master Vault PIN. This page is only reachable from this computer, never through the guest tunnel.</p>
<input id="pin" type="password" placeholder="Master PIN" autocomplete="current-password"><div id="lerr" class="no" style="min-height:18px;margin:8px 0;font-size:13px"></div><button id="go" class="on" style="width:100%">Log in</button></div>
<main id="app" style="display:none">
<nav id="tabs"><button data-t="overview" class="on">Overview</button><button data-t="users">Users</button><button data-t="invites">Invites</button><button data-t="activity">Activity</button></nav>
<section id="v"></section></main>
<script src="admin.js"></script></body></html>
